<style>
  body { margin: 0; padding: 40px 16px; font-family: system-ui, sans-serif; background: #eceff3; color: #222; text-align: center; }
  h1 { margin: 0 0 4px; color: #7c3aed; }
  p.sub { margin: 0 0 40px; color: #666; }
  .phones { display: flex; flex-wrap: wrap; justify-content: center; gap: 48px; }
  figure { margin: 0; }
  .phone { background: #111; border-radius: 44px; padding: 14px; box-shadow: 0 12px 32px rgba(0,0,0,.25); position: relative; }
  .phone img { display: block; width: 100%; height: auto; border-radius: 32px; background: #fff; }
  /* iPhone: pill-shaped Dynamic Island; Galaxy: small punch-hole camera */
  .iphone { width: 300px; }
  .iphone::before { content: ""; position: absolute; top: 24px; left: 50%; transform: translateX(-50%);
                    width: 84px; height: 24px; background: #000; border-radius: 12px; }
  .galaxy { width: 280px; border-radius: 36px; padding: 12px; }
  .galaxy img { border-radius: 26px; }
  .galaxy::before { content: ""; position: absolute; top: 22px; left: 50%; transform: translateX(-50%);
                    width: 12px; height: 12px; background: #000; border-radius: 50%; }
  figcaption { margin-top: 16px; font-weight: 600; }
  figcaption small { display: block; font-weight: 400; color: #666; margin-top: 2px; }
</style>
</head>
